name: CI

on:
  pull_request:
    # labeled / unlabeled re-run the Aero port check when `aero-port-not-needed` changes.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - main

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check UniCLStrat changes are ported to Aero
        if: github.event_name == 'pull_request'
        env:
          AERO_PORT_ACK: ${{ contains(github.event.pull_request.labels.*.name, 'aero-port-not-needed') }}
        run: bash script/ci/check-aero-port.sh "origin/${{ github.base_ref }}"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pin semver: `foundryup version stable` and Homebrew’s forge are newer than 1.0.0 and use
          # a different `forge fmt` layout. Match `forge --version` 1.0.0 (see FOUNDRY_VERSION).
          version: v1.0.0

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check src/ test/
        id: fmt

      - name: Run Forge build
        run: forge build --sizes
        id: build

      - name: Run Forge tests
        run: forge test -vvv
        id: test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Solhint
        run: npm install

      - name: Run Solhint
        run: npm run lint
        id: solhint
