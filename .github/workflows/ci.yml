name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pin semver: `foundryup version stable` and Homebrew’s forge are newer than 1.0.0 and use
          # a different `forge fmt` layout. Match `forge --version` 1.0.0 (see FOUNDRY_VERSION).
          version: v1.0.0

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check src/ test/
        id: fmt

      - name: Run Forge build
        run: forge build --sizes
        id: build

      - name: Run Forge tests
        run: forge test -vvv
        id: test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Solhint
        run: npm install

      - name: Run Solhint
        run: npm run lint
        id: solhint

  fork:
    # Mainnet fork suites (#63 GEN-10). Without the MAINNET_RPC_URL secret (forks, or before the
    # secret is added) the job passes with a notice; with it, a skipped fork suite fails the job.
    name: Mainnet fork tests
    runs-on: ubuntu-latest
    env:
      MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
      # Pinned so results are reproducible; bump deliberately. Aero (Ethereum) launched 2026-10-22.
      MAINNET_FORK_BLOCK: ${{ vars.MAINNET_FORK_BLOCK || '26485461' }}
    steps:
      - name: Check for RPC secret
        id: rpc
        run: |
          if [ -z "$MAINNET_RPC_URL" ]; then
            echo "::notice::MAINNET_RPC_URL secret not set; skipping fork tests"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.rpc.outputs.available == 'true'
        with:
          submodules: recursive

      - name: Install Foundry
        if: steps.rpc.outputs.available == 'true'
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.0.0

      - name: Run fork tests
        if: steps.rpc.outputs.available == 'true'
        run: |
          forge test --match-path 'test/fork/*' -vvv | tee fork.log
          if grep -q 'skipped' fork.log && ! grep -q ', 0 skipped' fork.log; then
            echo "::error::fork tests were skipped although MAINNET_RPC_URL is set"
            exit 1
          fi
